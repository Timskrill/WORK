<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Заметки</h1>
        <button id="themeBtn" class="theme-btn">Тёмная тема</button>
    </div>
    
    <textarea id="noteInput" placeholder="Введите текст заметки..."></textarea>
    
    <div class="buttons">
        <button id="saveBtn" class="save">Сохранить</button>
        <button id="clearBtn" class="clear">Очистить</button>
    </div>
    
    <div class="status" id="storageStatus"></div>
</div>

<script src="app.js"></script>
</body>
</html>
