<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Заметки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Заметки</h1>
        <button id="themeBtn" class="theme-btn">Тёмная тема</button>
    </div>
    
    <textarea id="noteInput" placeholder="Введите текст заметки..."></textarea>
    
    <div class="buttons">
        <button id="saveBtn" class="save">Сохранить</button>
        <button id="clearBtn" class="clear">Очистить</button>
    </div>
    
    <div class="status" id="storageStatus"></div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
}
</script>
</body>
</html>
