<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Заметки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Заметки</h1>
        <button id="themeBtn" class="theme-btn">Тёмная тема</button>
    </div>

    <div class="notes-list">
        <div class="list-header">
            <span>Список заметок</span>
            <button id="newNoteBtn" class="new-note-btn">+ Новая</button>
        </div>
        <div id="notesList" class="notes-items"></div>
    </div>

    <div class="note-editor">
        <input type="text" id="noteTitle" class="note-title" placeholder="Заголовок заметки">
        <textarea id="noteContent" class="note-content" placeholder="Введите текст заметки..."></textarea>
    </div>

    <div class="buttons">
        <button id="saveBtn" class="save">Сохранить</button>
        <button id="deleteBtn" class="delete">Удалить</button>
    </div>

    <div class="status" id="storageStatus"></div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
}
</script>
</body>
</html>
